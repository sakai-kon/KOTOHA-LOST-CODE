<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>KOTOHA: LOST CODE - Maintenance</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 15%, rgba(120, 120, 180, .18), transparent 34%),
        linear-gradient(160deg, #0c0c14, #151522 55%, #0b0b11);
      color: #f4f2ff;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 72px) clamp(24px, 6vw, 64px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(18,18,30,.82);
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      font-size: 30px;
    }
    .eyebrow {
      margin: 0 0 10px;
      letter-spacing: .18em;
      font-size: .75rem;
      opacity: .55;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: .08em;
    }
    .subtitle {
      margin: 8px 0 28px;
      letter-spacing: .22em;
      opacity: .65;
      font-size: .9rem;
    }
    .message {
      margin: 0 auto 18px;
      max-width: 48rem;
      line-height: 1.9;
      font-size: clamp(1rem, 2vw, 1.15rem);
    }
    .note {
      margin: 0;
      font-size: .86rem;
      opacity: .5;
      line-height: 1.7;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      font-size: .8rem;
      opacity: .72;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b8b1ff;
      box-shadow: 0 0 12px rgba(184,177,255,.8);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <p class="eyebrow">KOTOHA PROJECT</p>
    <h1>メンテナンス中</h1>
    <p class="subtitle">KOTOHA: LOST CODE</p>
    <p class="message">現在、ゲームの更新作業を行っています。<br>作業が完了するまで、しばらくお待ちください。</p>
    <p class="note">ゲーム本編は公開再開後に同じURLからアクセスできます。</p>
    <div class="status"><span class="dot"></span>MAINTENANCE MODE</div>
  </main>
</body>
</html>
