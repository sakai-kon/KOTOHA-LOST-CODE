<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KOTOHA: LOST CODE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="game" aria-label="KOTOHA: LOST CODE">
    <div id="stage">
      <img id="background" alt="" aria-hidden="true">
      <div id="characters" aria-live="polite"></div>
      <img id="event-image" alt="" aria-hidden="true">
      <div id="effects" aria-hidden="true"></div>
      <section id="dialogue" hidden>
        <div id="speaker"></div>
        <div id="text"></div>
        <div id="choices" role="group" aria-label="選択肢"></div>
        <button id="next" type="button">次へ ▶</button>
      </section>
      <div id="title-screen">
        <p class="eyebrow">A JSON-DRIVEN STORY GAME</p>
        <h1>KOTOHA</h1>
        <p class="subtitle">LOST CODE</p>
        <button id="start" type="button">START</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/game.js"></script>
</body>
</html>
